# ManyOS Many Ingest — camera-profielen (v0.1)
#
# Elk profiel matcht op bestandsnaam-patronen en/of ffprobe-metadata (make/model/brand/
# container-tags). Twee soorten bestandsnaam-patronen, met verschillend gewicht in
# classify():
#   - confirmed_filename_patterns: getoetst tegen echte ManyFast-footage -> HIGH confidence
#   - filename_patterns: illustratief/generiek, nog niet bevestigd -> MEDIUM confidence
# container_contains (containerformaat, bijv. "mxf" vs "mp4") is ook een HIGH-signaal
# als het bevestigd is tegen echte footage — zie sony_fx6/sony_fx3 hieronder.
# Metadata weegt binnen elk niveau zwaarder dan bestandsnaam (zie
# docs/MANY_INGEST_BUILD_PLAN.md, sectie 4) — dat is met name relevant hier omdat
# Sony FX6 en FX3 dezelfde generieke clip-naamgeving kunnen gebruiken; alleen
# metadata of een bevestigd patroon onderscheidt ze betrouwbaar.
#
# Getoetst tegen echte footage (2026-08-03): Sony XAVC-bestanden (.MP4) schrijven geen
# make/model in format.tags, maar wel een herkenbare major_brand "XAVC" — vandaar
# brand_contains hieronder. Sony MXF-bestanden gebruiken company_name/product_name
# i.p.v. make/model (afgehandeld in metadata_extractor.py, niet hier).
#
# Getoetst tegen echte footage (2026-08-03, vervolgonderzoek): over 9 crew-gelabelde
# "FX6"/"FX3"-mappen in 3 onafhankelijke projecten, zonder uitzondering: FX6-mappen
# bevatten uitsluitend .MXF, FX3-mappen uitsluitend .MP4 (XAVC). Dit is een bevestigde
# workflow-conventie bij ManyFast, GEEN onveranderlijke hardware-eigenschap van de
# camera's zelf (beide camera's kunnen technisch in beide formaten opnemen) — vandaar
# HIGH-confidence, niet omdat het een hardware-feit is zoals make/model, maar omdat het
# empirisch 100% consistent is gebleken. Zie
# docs/MANY_INGEST_CAMERA_PROFILES_V2_PROPOSAL.md secties 7-8.
#
# Nieuw apparaat toevoegen = nieuwe entry hieronder. Geen codewijziging nodig.

profiles:
  - id: sony_fx6
    label: "Sony FX6"
    category: Camera
    confirmed_filename_patterns:
      - "^611_\\d{4}\\.MXF$"   # bevestigd over drie onafhankelijke ManyFast-projecten
                                # met crew-gelabelde "FX6"-mappen, zie
                                # docs/MANY_INGEST_CAMERA_PROFILES_V2_PROPOSAL.md sectie 2b/3c.
    filename_patterns:
      - "^C\\d{4}\\..*"   # generiek Sony-clipnamenpatroon, gedeeld met FX3 — niet
                           # op zichzelf onderscheidend, vandaar niet "confirmed".
    metadata_match:
      model_contains:
        - "FX6"
        - "ILME-FX6"
      brand_contains:
        - "XAVC"
      container_contains:
        - "mxf"   # tweede, onafhankelijke bevestiging naast confirmed_filename_patterns

  - id: sony_a7iv
    label: "Sony A7 IV"
    category: Camera
    filename_patterns:
      - "^DSC\\d+\\..*"
    metadata_match:
      model_contains:
        - "A7M4"
        - "ILCE-7M4"

  - id: sony_fx3
    label: "Sony FX3"
    category: Camera
    filename_patterns:
      - "^C\\d{4}\\..*"
    metadata_match:
      model_contains:
        - "FX3"
        - "ILME-FX3"
      brand_contains:
        - "XAVC"
      container_contains:
        - "mp4"   # bevestigd over 3 onafhankelijke crew-gelabelde "FX3"-mappen:
                   # deze camera staat bij ManyFast altijd op XAVC-MP4, nooit MXF.

  - id: dji
    label: "DJI"
    category: Drone
    filename_patterns:
      - "^DJI_.*"
    metadata_match:
      make_contains:
        - "DJI"

  - id: gopro
    label: "GoPro"
    category: Camera
    filename_patterns:
      - "^GH\\d+\\..*"
      - "^GOPR\\d+\\..*"
      - "^GX\\d+\\..*"
    metadata_match:
      make_contains:
        - "GoPro"

  - id: audio
    label: "Audio"
    category: Audio
    audio_only: true
    filename_patterns:
      - ".*\\.(wav|mp3|m4a|aif|aiff)$"
